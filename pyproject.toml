[project]
name = "master-chef"
version = "0.1.0"
description = "Recipe manager with AI conversion"
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.9.0",
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "htmlmin2>=0.1.13",
    "instagrapi>=2.6.9",
    "jinja2>=3.1.6",
    "msgspec>=0.21.1",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-levenshtein>=0.27.3",
    "python-multipart>=0.0.32",
    "thefuzz>=0.22.1",
    "tldextract>=5.3.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.2",
]

[project.scripts]
master-chef = "webapp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webapp"]

[tool.black]
target-version = ["py314"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.ruff.lint]
ignore = [
    "UP047",
]

[tool.ty.src]
exclude = ["testing/"]

