<div class="carousel-wrapper">
    <div class="carousel-container">
        <div class="carousel-inner">
            <div class="message">
                Find
                {% if collection == 'unmade' %}
                tried and tested
                {% else %}
                unmade
                {% endif %}
                recipes with the <i class="fa fa-utensils"></i> button above!
            </div>
            <div class="message">
                Get a random recipe suggestion with the <i class="fa fa-random"></i> button!
            </div>
            {% if is_admin %}
            <div class="message">
                Welcome chef {{ username }}!
            </div>
            {% endif %}
            {% if latest is not none %}
            <div class="message">Check out the <a href="{{ url_for('recipe', id=latest, collection=collection) }}">latest recipe!</a></div>
            {% endif %}
        </div>
    </div>
</div>
